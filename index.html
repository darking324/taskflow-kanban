<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Collaborative Sprint &amp; Kanban Workspace</title>
  <meta name="description" content="TaskFlow: a Kanban board to add, move, drag and save tasks, built with HTML, CSS and vanilla JavaScript.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title">TaskFlow</h1>
      <p class="app-subtitle">Collaborative Sprint &amp; Kanban Workspace</p>
    </div>

    <form class="add-task-form" action="#" method="post">
      <label class="visually-hidden" for="task-input">Task title</label>
      <input class="task-input" id="task-input" type="text" name="title"
             placeholder="Add a task..." required>
      <label class="visually-hidden" for="priority-select">Priority</label>
      <select class="priority-select" id="priority-select" name="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button class="add-task-button" type="submit">Add task</button>
    </form>

    <div class="toolbar">
      <label class="visually-hidden" for="search-input">Search tasks</label>
      <input class="search-input" id="search-input" type="search"
             placeholder="Search tasks by title...">
      <button class="import-button" id="import-button" type="button">Import starter tasks</button>
      <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
    </div>
  </header>

  <section class="stats-bar" aria-label="Board statistics">
    <span class="stat"><strong id="stat-total">0</strong> total</span>
    <span class="stat"><strong id="stat-todo">0</strong> to do</span>
    <span class="stat"><strong id="stat-progress">0</strong> in progress</span>
    <span class="stat"><strong id="stat-done">0</strong> done</span>
    <span class="stat stat-completion"><strong id="stat-percent">0%</strong> complete</span>
    <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
  </section>

  <main class="board">
    <section class="column" data-status="todo" aria-labelledby="col-todo-heading">
      <header class="column-header">
        <h2 class="column-title" id="col-todo-heading">To Do</h2>
        <span class="task-count">0</span>
      </header>

    </section>

    <section class="column" data-status="progress" aria-labelledby="col-progress-heading">
      <header class="column-header">
        <h2 class="column-title" id="col-progress-heading">In Progress</h2>
        <span class="task-count">0</span>
      </header>

    </section>

    <section class="column" data-status="done" aria-labelledby="col-done-heading">
      <header class="column-header">
        <h2 class="column-title" id="col-done-heading">Done</h2>
        <span class="task-count">0</span>
      </header>

    </section>
  </main>

  <footer class="app-footer">
    <p>Built during the SkillMe Web Development Internship by Abhishek Kumar</p>
  </footer>

  <script src="script.js"></script>
  <script src="drag.js"></script>
</body>
</html>
